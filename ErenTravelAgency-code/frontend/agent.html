<!DOCTYPE html>
<html lang="sq">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Travel Agent Panel
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
   <div class="container-fluid">
    <a class="navbar-brand" href="agent.html">
     <img class="brand-logo" src="images/logo.png"/>
    </a>
    <button class="navbar-toggler" data-bs-target="#navbarNav" data-bs-toggle="collapse">
     <span class="navbar-toggler-icon">
     </span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
     <ul class="navbar-nav ms-auto">
      <li class="nav-item">
       <a class="nav-link" href="paketatTuristike.html">
        Paketa turistike
       </a>
      </li>
      <li class="nav-item">
       <a class="nav-link active" href="agent.html">
        Paneli i agjencisë
       </a>
      </li>
      <li class="nav-item d-flex" id="authNav">
      </li>
     </ul>
    </div>
   </div>
  </nav>
  <header class="dashboard-header modern-header">
   <div class="container">
    <span class="mini-label">
     Travel Agency Dashboard
    </span>
    <h1>
     Paneli i Travel Agent
    </h1>
   </div>
  </header>
  <main class="container py-5">
   <div class="row g-3 mb-4" id="agentStats">
   </div>
   <ul class="nav nav-pills mb-4">
    <li class="nav-item">
     <button class="nav-link active" onclick="showTab('packages',this)">
      Paketat e mia
     </button>
    </li>
    <li class="nav-item">
     <button class="nav-link" onclick="showTab('create',this)">
      Publiko paketë
     </button>
    </li>
    <li class="nav-item">
     <button class="nav-link" onclick="showTab('reservations',this)">
      Rezervimet
     </button>
    </li>
    <li class="nav-item">
     <button class="nav-link" onclick="showTab('reviews',this)">
      Reviews
     </button>
    </li>
    <li class="nav-item">
     <button class="nav-link" onclick="showTab('followers',this)">
      Followers
     </button>
    </li>
    <li class="nav-item">
     <button class="nav-link" onclick="showTab('performance',this)">
      Performanca
     </button>
    </li>
   </ul>
   <div id="content">
   </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="scripts/app.js">
  </script>
  <script>
   const u=requireLogin(['TravelAgent']); const agency=u?(u.agencyName||u.fullName):''; if(u) agentInfo.textContent=`Agjencia: ${agency}`;
let myPackages=[],myReservations=[],myReviews=[],myFollowers=[]; const el=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function activate(btn){document.querySelectorAll('.nav-pills .nav-link').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active')}
async function loadAgentData(){[myPackages,myReservations,myReviews,myFollowers]=await Promise.all([jsonFetch(API+`/packages?agencyName=${encodeURIComponent(agency)}`),jsonFetch(API+`/reservations?agencyName=${encodeURIComponent(agency)}`),jsonFetch(API+`/engagement/reviews?agencyName=${encodeURIComponent(agency)}`),jsonFetch(API+`/engagement/follows?agencyName=${encodeURIComponent(agency)}`)]);renderAgentStats();}
function renderAgentStats(){const total=myReservations.reduce((s,r)=>s+Number(r.cmimi||0),0);const pending=myReservations.filter(r=>!r.confirmed).length;const avg=myReviews.length?myReviews.reduce((s,r)=>s+Number(r.rating||0),0)/myReviews.length:0;agentStats.innerHTML=`<div class="col-md-2 col-6"><div class="stat-card"><span>Paketa aktive</span><b>${myPackages.length}</b></div></div><div class="col-md-2 col-6"><div class="stat-card"><span>Rezervime</span><b>${myReservations.length}</b></div></div><div class="col-md-2 col-6"><div class="stat-card warning"><span>Në pritje</span><b>${pending}</b></div></div><div class="col-md-2 col-6"><div class="stat-card success"><span>Xhiro</span><b>${money(total)}</b></div></div><div class="col-md-2 col-6"><div class="stat-card"><span>Rating</span><b>${avg.toFixed(1)} ⭐</b></div></div><div class="col-md-2 col-6"><div class="stat-card"><span>Followers</span><b>${myFollowers.length}</b></div></div>`}
async function showTab(tab,btn){activate(btn); await loadAgentData(); if(tab==='create')return createForm(); if(tab==='reservations')return reservations(); if(tab==='reviews')return reviews(); if(tab==='followers')return followers(); if(tab==='performance')return performance(); return packages();}
function packages(){content.innerHTML=`<div class="eren-panel"><div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">Paketat e publikuara nga ${esc(agency)}</h3><button class="btn btn-primary" onclick="showTab('create',document.querySelectorAll('.nav-pills .nav-link')[1])">Shto paketë</button></div><div class="row g-4">${myPackages.map((p,i)=>`<div class="col-md-4"><div class="card h-100 shadow-sm package-card-no-zoom"><img class="card-img-top package-img" src="${p.imageUrl||fallbackImage(i)}"><div class="card-body"><h5>${esc(p.paketa)}</h5><p>${esc(p.pershkrimi||'')}</p><p>${p.kohezgjatja} ditë • ${p.travelDate?new Date(p.travelDate).toLocaleDateString('sq-AL'):'Me kërkesë'} • <b>${money(p.cmimi)}</b></p><div class="capacity-editor mb-3"><label class="form-label small fw-bold mb-1">Kapaciteti maksimal i personave</label><div class="input-group input-group-sm"><input id="cap-${p.id}" type="number" min="1" class="form-control" value="${p.maxPersons||150}"><button class="btn btn-outline-primary" onclick="saveCapacity(${p.id})">Ruaj</button></div><small class="text-muted">Rezervuar: ${p.reservedPersons||0} / ${p.maxPersons||150} • Të lira: ${p.remainingPersons??((p.maxPersons||150)-(p.reservedPersons||0))}</small><div id="cap-msg-${p.id}" class="small mt-1"></div></div><div class="d-flex gap-2"><button class="btn btn-outline-primary btn-sm" onclick="editForm(${p.id})">Edito paketën</button><button class="btn btn-danger btn-sm" onclick="deletePackage(${p.id})">Hiqe</button></div></div></div></div>`).join('')||'<p>Nuk ke publikuar ende paketa.</p>'}</div></div>`}
async function saveCapacity(id){const input=el(`cap-${id}`);const msg=el(`cap-msg-${id}`);const value=Number(input.value);if(!value||value<1){msg.className='small mt-1 text-danger';msg.textContent='Vendos një kapacitet të vlefshëm.';return;}try{msg.className='small mt-1 text-muted';msg.textContent='Duke ruajtur...';const data=await jsonFetch(API+`/packages/${id}/capacity?agencyName=${encodeURIComponent(agency)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({maxPersons:value})});msg.className='small mt-1 text-success';msg.textContent=`Kapaciteti u ruajt: ${data.maxPersons} persona.`;await loadAgentData();setTimeout(packages,350);}catch(e){msg.className='small mt-1 text-danger';msg.textContent=e.message}}
function formHtml(title,action){return `<div class="eren-panel"><h3>${title}</h3><input id="pId" type="hidden"><input id="oldImage" type="hidden"><div class="row g-3"><div class="col-md-6"><label class="form-label">Emri i paketës</label><input id="pName" class="form-control" placeholder="p.sh. Stamboll – Turqi"><label class="form-label mt-2">Kohëzgjatja në ditë</label><input id="pDays" type="number" min="1" class="form-control" value="3"><label class="form-label mt-2">Çmimi për person</label><input id="pPrice" type="number" min="1" class="form-control" value="250"><label class="form-label mt-2">Data e udhëtimit</label><input id="pTravelDate" type="date" class="form-control"><label class="form-label mt-2">Kapaciteti maksimal i personave</label><input id="pMaxPersons" type="number" min="1" class="form-control" value="150"><label class="form-label mt-2">Përshkrimi / oferta promocionale</label><textarea id="pDesc" class="form-control" rows="4"></textarea><label class="form-label mt-2">Foto e paketës</label><input id="pImage" type="file" accept="image/*" class="form-control"><button class="btn btn-primary mt-3" onclick="${action}">${title.includes('Edito')?'Ruaj ndryshimet':'Publiko paketën'}</button><div id="msg" class="small mt-2"></div></div><div class="col-md-6"><img id="preview" class="img-fluid preview-img d-none"></div></div></div>`}
function createForm(){content.innerHTML=formHtml('Publiko paketë me foto','createPackage()');bindPreview();}
function editForm(id){const p=myPackages.find(x=>x.id===id); if(!p)return; content.innerHTML=formHtml('Edito paketën','updatePackage()');el('pId').value=p.id;el('pName').value=p.paketa;el('pDays').value=p.kohezgjatja;el('pPrice').value=p.cmimi;el('pTravelDate').value=p.travelDate?p.travelDate.slice(0,10):'';el('pMaxPersons').value=p.maxPersons||150;el('pDesc').value=p.pershkrimi||'';el('oldImage').value=p.imageUrl||'';if(p.imageUrl){el('preview').src=p.imageUrl;el('preview').classList.remove('d-none')}bindPreview();}
function bindPreview(){el('pImage').addEventListener('change',()=>{const f=el('pImage').files[0]; if(f){el('preview').src=URL.createObjectURL(f); el('preview').classList.remove('d-none')}})}
async function uploadImage(){if(!el('pImage').files[0])return el('oldImage')?el('oldImage').value:null; const fd=new FormData(); fd.append('image',el('pImage').files[0]); const res=await fetch(API+'/packages/upload-image',{method:'POST',body:fd}); const data=await res.json(); if(!res.ok) throw new Error(data.message||'Foto nuk u ngarkua.'); return data.imageUrl;}
function packagePayload(imageUrl){return {paketa:el('pName').value,kohezgjatja:Number(el('pDays').value),cmimi:Number(el('pPrice').value),travelDate:el('pTravelDate').value||null,maxPersons:Number(el('pMaxPersons').value)||150,pershkrimi:el('pDesc').value,agencyName:agency,imageUrl}}
async function createPackage(){try{el('msg').className='small mt-2 text-muted';el('msg').textContent='Duke publikuar...'; const imageUrl=await uploadImage(); await jsonFetch(API+'/packages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(packagePayload(imageUrl))});el('msg').className='small mt-2 text-success';el('msg').textContent='Paketa u publikua me sukses.'; await loadAgentData();}catch(e){el('msg').className='small mt-2 text-danger';el('msg').textContent=e.message}}
async function updatePackage(){try{el('msg').className='small mt-2 text-muted';el('msg').textContent='Duke ruajtur...'; const imageUrl=await uploadImage(); await jsonFetch(API+`/packages/${el('pId').value}?agencyName=${encodeURIComponent(agency)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(packagePayload(imageUrl))});el('msg').className='small mt-2 text-success';el('msg').textContent='Paketa u përditësua me sukses.'; await loadAgentData();}catch(e){el('msg').className='small mt-2 text-danger';el('msg').textContent=e.message}}
async function deletePackage(id){if(!confirm('A je i sigurt që do ta heqësh këtë paketë?'))return; await fetch(API+`/packages/${id}?agencyName=${encodeURIComponent(agency)}`,{method:'DELETE'}); await showTab('packages',document.querySelectorAll('.nav-pills .nav-link')[0]);}
function reservations(){content.innerHTML=`<div class="eren-panel"><h3>Rezervimet për agjencinë time</h3><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Klienti</th><th>Paketa</th><th>Datat</th><th>Persona/Dhoma</th><th>Çmimi</th><th>Statusi</th><th>Veprim</th></tr></thead><tbody>${myReservations.map(r=>`<tr><td>${esc(r.emri)}<br><small>${esc(r.email)}</small></td><td>${esc(r.paketa)}</td><td>${new Date(r.dataNisjes).toLocaleDateString('sq-AL')} - ${new Date(r.dataKthimit).toLocaleDateString('sq-AL')}</td><td>${r.nrPersonave} persona<br>${r.nrDhomave} dhoma</td><td><b>${money(r.cmimi)}</b></td><td><span class="badge ${r.isCancelled?'bg-secondary':(r.confirmed?'badge-approved':'badge-pending')}">${r.isCancelled?'Anuluar':(r.confirmed?'Aprovuar':'Në pritje')}</span></td><td><div class="d-flex gap-2">${r.isCancelled?'-':(r.confirmed?'-':`<button class="btn btn-success btn-sm" onclick="approveRes(${r.id})">Aprovo</button>`)}<button class="btn btn-outline-danger btn-sm" onclick="deleteRes(${r.id})">Fshi</button></div></td></tr>`).join('')||'<tr><td colspan="7">Nuk ka rezervime.</td></tr>'}</tbody></table></div></div>`}
async function approveRes(id){await fetch(API+`/reservations/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({isConfirmed:true})});await showTab('reservations',document.querySelectorAll('.nav-pills .nav-link')[2])}
async function deleteRes(id){if(!confirm('Ta fshij këtë rezervim?'))return;await fetch(API+`/reservations/${id}`,{method:'DELETE'});await showTab('reservations',document.querySelectorAll('.nav-pills .nav-link')[2])}
function reviews(){content.innerHTML=`<div class="eren-panel"><h3>Reviews dhe feedback</h3><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Klienti</th><th>Paketa</th><th>Rating</th><th>Koment</th><th>Data</th></tr></thead><tbody>${myReviews.map(r=>`<tr><td>${esc(r.userName)}<br><small>${esc(r.userEmail)}</small></td><td>${r.packageId||'-'}</td><td>${'⭐'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td><td>${esc(r.comment||'')}</td><td>${new Date(r.createdAt).toLocaleString('sq-AL')}</td></tr>`).join('')||'<tr><td colspan="5">Ende nuk ka reviews.</td></tr>'}</tbody></table></div></div>`}
function followers(){content.innerHTML=`<div class="eren-panel"><h3>Klientët që ndjekin agjencinë</h3><div class="row g-3">${myFollowers.map(f=>`<div class="col-md-4"><div class="stat-card"><span>Email klienti</span><b style="font-size:16px">${esc(f.userEmail)}</b><br><small>${new Date(f.createdAt).toLocaleDateString('sq-AL')}</small></div></div>`).join('')||'<p>Nuk ka followers ende.</p>'}</div></div>`}
function performance(){const byPackage={};myReservations.forEach(r=>{if(!byPackage[r.paketa])byPackage[r.paketa]={count:0,total:0,confirmed:0};byPackage[r.paketa].count++;if(r.confirmed)byPackage[r.paketa].confirmed++;byPackage[r.paketa].total+=Number(r.cmimi||0)});content.innerHTML=`<div class="eren-panel"><h3>Performanca e ofertave</h3><p class="text-muted">Rezervimet, konfirmimet dhe xhiro sipas paketës.</p><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Paketa</th><th>Rezervime</th><th>Të konfirmuara</th><th>Xhiro</th></tr></thead><tbody>${Object.entries(byPackage).map(([p,x])=>`<tr><td>${esc(p)}</td><td>${x.count}</td><td>${x.confirmed}</td><td><b>${money(x.total)}</b></td></tr>`).join('')||'<tr><td colspan="4">Ende nuk ka të dhëna performance.</td></tr>'}</tbody></table></div></div>`}
loadAgentData().then(packages);
  </script>
 </body>
</html>
