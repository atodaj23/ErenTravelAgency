<!DOCTYPE html>
<html lang="sq">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Eren Travel Management System
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body class="auth-only-page">
  <section class="login-hero clean-login">
   <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
     <div class="col-xl-5 col-lg-6 col-md-9">
      <div class="text-center mb-4">
       <img alt="Eren Travel Logo" class="login-logo minimal-logo" src="images/logo.png"/>
       <h1 class="login-title">
        Eren Travel Management System
       </h1>
      </div>
      <div class="login-card" id="authBox">
       <ul class="nav nav-pills login-tabs mb-4" id="roleTabs">
        <li class="nav-item">
         <button class="nav-link active" data-role="Client">
          Client
         </button>
        </li>
        <li class="nav-item">
         <button class="nav-link" data-role="B2B">
          B2B
         </button>
        </li>
        <li class="nav-item">
         <button class="nav-link" data-role="TravelAgent">
          Travel Agent
         </button>
        </li>
        <li class="nav-item">
         <button class="nav-link" data-role="Administrator">
          Admin
         </button>
        </li>
       </ul>
       <div class="row g-4">
        <div class="col-12" id="loginBox">
         <h4 class="fw-bold mb-3">
          Login
         </h4>
         <label class="form-label">
          Email
         </label>
         <input autocomplete="email" class="form-control" id="loginEmail" type="email"/>
         <label class="form-label mt-3">
          Password
         </label>
         <input autocomplete="current-password" class="form-control" id="loginPassword" type="password"/>
         <button class="btn btn-primary w-100 mt-4" onclick="login()">
          Hyr në sistem
         </button>
         <button class="btn btn-link w-100 mt-2 p-0" id="forgotPasswordBtn" onclick="showResetPassword()" type="button">
          Kam harruar password-in
         </button>
         <div class="small mt-3" id="loginMsg">
         </div>
         <div class="d-none mt-3 p-3 rounded bg-light" id="resetBox">
          <h6 class="fw-bold">
           Reset password
          </h6>
          <label class="form-label">
           Pyetja e sigurisë që zgjodhe në regjistrim
          </label>
          <select class="form-select" id="resetSecurityQuestion">
           <option value="">
            Zgjidh pyetjen e sigurisë
           </option>
           <option value="Cili është qyteti yt i lindjes?">
            Cili është qyteti yt i lindjes?
           </option>
           <option value="Cili është emri i shkollës tënde të parë?">
            Cili është emri i shkollës tënde të parë?
           </option>
           <option value="Cili është emri i kafshës tënde të parë?">
            Cili është emri i kafshës tënde të parë?
           </option>
           <option value="Cili është emri i agjencisë/biznesit?">
            Cili është emri i agjencisë/biznesit?
           </option>
          </select>
          <label class="form-label mt-2">
           Përgjigjja e pyetjes së sigurisë
          </label>
          <input class="form-control" id="resetSecurityAnswer" placeholder="Përgjigjja e mbajtur mend"/>
          <label class="form-label mt-2">
           Password i ri
          </label>
          <input class="form-control" id="resetPassword" type="password"/>
          <button class="btn btn-outline-primary w-100 mt-3" onclick="resetPassword()" type="button">
           Ndrysho password
          </button>
          <div class="small mt-2" id="resetMsg">
          </div>
         </div>
        </div>
        <div class="col-12" id="registerBox">
         <hr class="my-2"/>
         <h5 class="fw-bold mt-3">
          Krijo llogari
         </h5>
         <div class="row g-2">
          <div class="col-md-6">
           <label class="form-label">
            Emri i plotë
           </label>
           <input class="form-control" id="regName"/>
          </div>
          <div class="col-md-6">
           <label class="form-label">
            Email
           </label>
           <input class="form-control" id="regEmail" type="email"/>
          </div>
          <div class="col-md-12">
           <label class="form-label">
            Password
           </label>
           <input class="form-control" id="regPassword" type="password"/>
          </div>
          <div class="col-md-12">
           <label class="form-label">
            Pyetje sigurie
           </label>
           <select class="form-select" id="securityQuestion">
            <option value="Cili është qyteti yt i lindjes?">
             Cili është qyteti yt i lindjes?
            </option>
            <option value="Cili është emri i shkollës tënde të parë?">
             Cili është emri i shkollës tënde të parë?
            </option>
            <option value="Cili është emri i kafshës tënde të parë?">
             Cili është emri i kafshës tënde të parë?
            </option>
            <option value="Cili është emri i agjencisë/biznesit?">
             Cili është emri i agjencisë/biznesit?
            </option>
           </select>
          </div>
          <div class="col-md-12">
           <label class="form-label">
            Përgjigjja e pyetjes së sigurisë
           </label>
           <input class="form-control" id="securityAnswer" placeholder="Mbaje mend këtë përgjigje për forgot password"/>
          </div>
         </div>
         <div class="d-none mt-2" id="businessFields">
          <div class="row g-2">
           <div class="col-md-6">
            <label class="form-label">
             Emri i agjencisë/biznesit
            </label>
            <input class="form-control" id="agencyName"/>
           </div>
           <div class="col-md-6">
            <label class="form-label">
             Tax ID / NIPT
            </label>
            <input class="form-control" id="taxId"/>
           </div>
           <div class="col-md-6">
            <label class="form-label">
             Adresa
            </label>
            <input class="form-control" id="address"/>
           </div>
           <div class="col-md-6">
            <label class="form-label">
             Telefon
            </label>
            <input class="form-control" id="phone"/>
           </div>
          </div>
         </div>
         <button class="btn btn-outline-primary w-100 mt-3" onclick="registerUser()">
          Regjistrohu
         </button>
         <div class="small mt-3" id="registerMsg">
         </div>
        </div>
       </div>
      </div>
     </div>
    </div>
   </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="scripts/app.js">
  </script>
  <script>
   let selectedRole='Client';
const $=id=>document.getElementById(id);
document.querySelectorAll('#roleTabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#roleTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); selectedRole=b.dataset.role;
  $('registerBox').classList.toggle('d-none',selectedRole==='Administrator');
  $('businessFields').classList.toggle('d-none',!(selectedRole==='B2B'||selectedRole==='TravelAgent'));
  $('forgotPasswordBtn').classList.toggle('d-none', selectedRole==='Administrator');
  if(selectedRole==='Administrator') $('resetBox').classList.add('d-none');
  $('loginMsg').textContent=''; $('registerMsg').textContent='';
}));
function msg(id,t,err=false){let e=$(id);e.className='small mt-3 '+(err?'text-danger':'text-success');e.textContent=t;}
async function registerUser(){
  try{
    const payload={fullName:$('regName').value.trim(),email:$('regEmail').value.trim(),password:$('regPassword').value,role:selectedRole,agencyName:$('agencyName')?.value?.trim()||'',taxId:$('taxId')?.value?.trim()||'',address:$('address')?.value?.trim()||'',phone:$('phone')?.value?.trim()||'',securityQuestion:$('securityQuestion').value,securityAnswer:$('securityAnswer').value.trim()};
    await jsonFetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    msg('registerMsg','Llogaria u krijua. Prit aprovimin nga administratori.');
  }catch(e){msg('registerMsg',e.message,true)}
}
async function login(){
  try{
    const u=await jsonFetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('loginEmail').value.trim(),password:$('loginPassword').value,role:selectedRole})});
    setUser(u);
    if(u.role==='Administrator') location.href='admin.html';
    else if(u.role==='TravelAgent') location.href='agent.html';
    else location.href='paketatTuristike.html';
  }catch(e){msg('loginMsg',e.message,true)}
}
function showResetPassword(){
  $('resetBox').classList.toggle('d-none');
  $('resetMsg').textContent='';
}
async function resetPassword(){
  try{
    if(selectedRole==='Administrator'){msg('resetMsg','Admin password nuk ndryshohet nga kjo formë.',true);return;}
    const email=$('loginEmail').value.trim();
    const newPassword=$('resetPassword').value;
    const securityQuestion=$('resetSecurityQuestion').value;
    const securityAnswer=$('resetSecurityAnswer').value.trim();
    if(!email || !securityQuestion || !securityAnswer || !newPassword){msg('resetMsg','Plotëso email-in, pyetjen e sigurisë, përgjigjen dhe password-in e ri.',true);return;}
    await jsonFetch(API+'/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,role:selectedRole,securityQuestion,securityAnswer,newPassword})});
    msg('resetMsg','Password u ndryshua. Tani mund të bësh login.');
  }catch(e){msg('resetMsg',e.message,true)}
}
  </script>
 </body>
</html>
