<!DOCTYPE html>
<html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Panel</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar"><div class="container-fluid"><a class="navbar-brand" href="admin.html"><img src="images/logo.png" class="brand-logo"></a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link active" href="admin.html">Admin Panel</a></li><li class="nav-item"><a class="nav-link" href="paketatTuristike.html">Paketa</a></li><li class="nav-item d-flex" id="authNav"></li></ul></div></div></nav>
<header class="dashboard-header modern-header"><div class="container"><span class="mini-label">Monitorim i platformës</span><h1>Paneli i Administratorit</h1><p class="mb-0">Admini monitoron userat, agjencitë, paketat, rezervimet, reviews, raportimet dhe përdorimin e platformës.</p></div></header>
<main class="container py-5"><div class="row g-3 mb-4" id="statsCards"></div><ul class="nav nav-pills mb-4 admin-tabs"><li class="nav-item"><button class="nav-link active" onclick="showAdminTab('users',this)">Përdoruesit</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('reservations',this)">Rezervimet</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('agencies',this)">Agjencitë</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('packages',this)">Paketat</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('reviews',this)">Reviews</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('reports',this)">Raportime</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('usage',this)">Raporte</button></li><li class="nav-item"><button class="nav-link" onclick="showAdminTab('logs',this)">Activity Logs</button></li></ul><div id="adminContent"></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="scripts/app.js"></script>
<script>
requireLogin(['Administrator']);let users=[],reservations=[],reviews=[],reports=[],packages=[],activityLogs=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function activate(btn){document.querySelectorAll('.admin-tabs .nav-link').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active')}
async function loadData(){[users,reservations,reviews,reports,packages,activityLogs]=await Promise.all([jsonFetch(API+'/users'),jsonFetch(API+'/reservations'),jsonFetch(API+'/engagement/reviews'),jsonFetch(API+'/engagement/reports'),jsonFetch(API+'/packages'),jsonFetch(API+'/activitylogs')]);renderStats();}
function renderStats(){const totalUsers=users.length;const pendingUsers=users.filter(u=>!u.isApproved).length;const totalReservations=reservations.length;const pendingReservations=reservations.filter(r=>!r.confirmed).length;const revenue=reservations.reduce((s,r)=>s+Number(r.cmimi||0),0);const agencies=new Set(packages.map(p=>p.agencyName||'Eren Travel')).size;statsCards.innerHTML=`<div class="col-md-2 col-6"><div class="stat-card"><span>Usera</span><b>${totalUsers}</b></div></div><div class="col-md-2 col-6"><div class="stat-card warning"><span>Usera në pritje</span><b>${pendingUsers}</b></div></div><div class="col-md-2 col-6"><div class="stat-card"><span>Rezervime</span><b>${totalReservations}</b></div></div><div class="col-md-2 col-6"><div class="stat-card warning"><span>Rez. në pritje</span><b>${pendingReservations}</b></div></div><div class="col-md-2 col-6"><div class="stat-card success"><span>Xhiro totale</span><b>${money(revenue)}</b></div></div><div class="col-md-2 col-6"><div class="stat-card"><span>Agjenci aktive</span><b>${agencies}</b></div></div>`}
async function showAdminTab(tab,btn){activate(btn);await loadData();if(tab==='reservations')return renderReservations();if(tab==='agencies')return renderAgencies();if(tab==='packages')return renderPackages();if(tab==='reviews')return renderReviews();if(tab==='reports')return renderReports();if(tab==='usage')return renderUsage();if(tab==='logs')return renderLogs();return renderUsers();}
function renderUsers(){adminContent.innerHTML=`<div class="eren-panel"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3"><div><h3 class="mb-0">Përdoruesit e regjistruar</h3><span class="text-muted small">Aprovo, fshi ose monitoro rolin e secilit user.</span></div><div class="d-flex gap-2 flex-wrap"><button class="btn btn-outline-warning btn-sm" onclick="cleanupOrphanAgencyData()">Pastro të dhënat e agjencive të fshira</button><button class="btn btn-outline-danger btn-sm" onclick="deleteAllUsers()">Fshi të gjithë userat</button></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Emri</th><th>Email</th><th>Roli</th><th>Agjencia/Biznesi</th><th>Tax ID</th><th>Telefon</th><th>Statusi</th><th>Veprime</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.fullName)}</td><td>${esc(u.email)}</td><td>${roleLabel(u.role)}</td><td>${esc(u.agencyName)||'-'}</td><td>${esc(u.taxId)||'-'}</td><td>${esc(u.phone)||'-'}</td><td><span class="badge ${u.isApproved?'badge-approved':'badge-pending'}">${u.isApproved?'Aprovuar':'Në pritje'}</span></td><td><div class="d-flex gap-2 flex-wrap">${u.isApproved?'':`<button class="btn btn-success btn-sm" onclick="approve(${u.id})">Aprovo</button>`}<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${esc(u.fullName)}')">Fshi</button></div></td></tr>`).join('')||'<tr><td colspan="8">Nuk ka usera.</td></tr>'}</tbody></table></div></div>`}
function renderReservations(){adminContent.innerHTML=`<div class="eren-panel"><div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="mb-0">Të gjitha rezervimet</h3><p class="text-muted small mb-0">Klienti, agjencia, paketa, çmimi dhe statusi.</p></div><button class="btn btn-outline-primary btn-sm" onclick="showAdminTab('reservations')">Rifresko</button></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Klienti</th><th>Agjencia</th><th>Paketa</th><th>Datat</th><th>Persona/Dhoma</th><th>Çmimi</th><th>Statusi</th><th>Veprim</th></tr></thead><tbody>${reservations.map(r=>`<tr><td>${esc(r.emri)}<br><small>${esc(r.email)}</small></td><td><b>${esc(r.agencyName||'Eren Travel')}</b></td><td>${esc(r.paketa)}</td><td>${new Date(r.dataNisjes).toLocaleDateString('sq-AL')} - ${new Date(r.dataKthimit).toLocaleDateString('sq-AL')}</td><td>${r.nrPersonave} persona<br>${r.nrDhomave} dhoma</td><td><b>${money(r.cmimi)}</b></td><td><span class="badge ${r.isCancelled?'bg-secondary':(r.confirmed?'badge-approved':'badge-pending')}">${r.isCancelled?'Anuluar':(r.confirmed?'Aprovuar':'Në pritje')}</span></td><td><button class="btn btn-outline-danger btn-sm" onclick="deleteReservation(${r.id})">Fshi</button></td></tr>`).join('')||'<tr><td colspan="8">Nuk ka rezervime.</td></tr>'}</tbody></table></div></div>`}
function renderAgencies(){const map={};packages.forEach(p=>{const a=p.agencyName||'Eren Travel';if(!map[a])map[a]={packages:0,res:0,confirmed:0,total:0,clients:new Set(),rating:[]};map[a].packages++;});reservations.forEach(r=>{const a=r.agencyName||'Eren Travel';if(!map[a])map[a]={packages:0,res:0,confirmed:0,total:0,clients:new Set(),rating:[]};map[a].res++;if(r.confirmed)map[a].confirmed++;map[a].total+=Number(r.cmimi||0);map[a].clients.add(r.email);});reviews.forEach(r=>{const a=r.agencyName||'Eren Travel';if(!map[a])map[a]={packages:0,res:0,confirmed:0,total:0,clients:new Set(),rating:[]};map[a].rating.push(Number(r.rating||0));});const rows=Object.entries(map).map(([a,x])=>`<tr><td><b>${esc(a)}</b></td><td>${x.packages}</td><td>${x.res}</td><td>${x.confirmed}</td><td>${x.clients.size}</td><td>${x.rating.length?(x.rating.reduce((s,v)=>s+v,0)/x.rating.length).toFixed(2):'0.00'} ⭐</td><td><b>${money(x.total)}</b></td><td><a class="btn btn-outline-primary btn-sm" href="${API}/activitylogs/agency-report?agencyName=${encodeURIComponent(a)}">Download Report</a></td></tr>`).join('');adminContent.innerHTML=`<div class="eren-panel"><h3>Përmbledhje sipas agjencive</h3><p class="text-muted small">Monitorim i performancës për secilën agjenci. Admini mund të shkarkojë raport për secilën agjenci.</p><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Agjencia</th><th>Paketa</th><th>Rezervime</th><th>Aprovuar</th><th>Klientë unikë</th><th>Rating</th><th>Xhiro</th><th>Raport</th></tr></thead><tbody>${rows||'<tr><td colspan="8">Nuk ka agjenci aktive.</td></tr>'}</tbody></table></div></div>`}
function renderPackages(){adminContent.innerHTML=`<div class="eren-panel"><h3>Të gjitha paketat</h3><p class="text-muted small">Admini sheh paketat e publikuara nga të gjitha agjencitë.</p><div class="row g-4">${packages.map((p,i)=>`<div class="col-md-4"><div class="card h-100 package-card-no-zoom"><img class="package-img" src="${p.imageUrl||fallbackImage(i)}"><div class="card-body"><h5>${esc(p.paketa)}</h5><p class="small text-muted">${esc(p.agencyName||'Eren Travel')} • ${p.kohezgjatja} ditë</p><p>${esc(p.pershkrimi||'')}</p><b>${money(p.cmimi)}</b></div></div></div>`).join('')||'<p>Nuk ka paketa.</p>'}</div></div>`}
function renderReviews(){adminContent.innerHTML=`<div class="eren-panel"><h3>Reviews të platformës</h3><p class="text-muted small">Feedback i klientëve për agjencitë/paketat.</p><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Klienti</th><th>Agjencia</th><th>Paketa ID</th><th>Rating</th><th>Koment</th><th>Data</th></tr></thead><tbody>${reviews.map(r=>`<tr><td>${esc(r.userName)}<br><small>${esc(r.userEmail)}</small></td><td>${esc(r.agencyName)}</td><td>${r.packageId||'-'}</td><td>${'⭐'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td><td>${esc(r.comment||'')}</td><td>${new Date(r.createdAt).toLocaleString('sq-AL')}</td></tr>`).join('')||'<tr><td colspan="6">Nuk ka reviews.</td></tr>'}</tbody></table></div></div>`}
function renderReports(){adminContent.innerHTML=`<div class="eren-panel"><h3>Raportime / përmbajtje të papërshtatshme</h3><p class="text-muted small">Problemet e raportuara nga userat.</p><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Raportuesi</th><th>Target</th><th>Agjencia</th><th>Arsyeja</th><th>Statusi</th><th>Data</th><th>Veprim</th></tr></thead><tbody>${reports.map(r=>`<tr><td>${esc(r.reporterEmail||'-')}</td><td>${esc(r.targetType)} #${r.targetId||''}</td><td>${esc(r.agencyName||'-')}</td><td>${esc(r.reason)}</td><td><span class="badge ${r.status==='Closed'?'badge-approved':'badge-pending'}">${r.status}</span></td><td>${new Date(r.createdAt).toLocaleString('sq-AL')}</td><td>${r.status==='Closed'?'-':`<button class="btn btn-success btn-sm" onclick="closeReport(${r.id})">Mbyll</button>`}</td></tr>`).join('')||'<tr><td colspan="7">Nuk ka raportime.</td></tr>'}</tbody></table></div></div>`}
function renderLogs(){const badge=s=>s==='Success'?'badge-approved':s==='Failed'?'badge-pending':'bg-danger';adminContent.innerHTML=`<div class="eren-panel"><div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="mb-0">Activity Logs / Audit Trail</h3><p class="text-muted small mb-0">Këtu ruhen login attempts, booking attempts dhe errors që ndodhin në sistem.</p></div><button class="btn btn-outline-primary btn-sm" onclick="showAdminTab('logs')">Rifresko</button></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Data</th><th>Veprimi</th><th>Statusi</th><th>User</th><th>Roli</th><th>Agjencia</th><th>Përshkrimi</th><th>Error</th></tr></thead><tbody>${activityLogs.map(l=>`<tr><td>${new Date(l.createdAt).toLocaleString('sq-AL')}</td><td><b>${esc(l.actionType)}</b></td><td><span class="badge ${badge(l.status)}">${esc(l.status)}</span></td><td>${esc(l.userEmail||'-')}</td><td>${esc(l.userRole||'-')}</td><td>${esc(l.agencyName||'-')}</td><td>${esc(l.description||'')}</td><td class="text-danger small">${esc(l.errorMessage||'')}</td></tr>`).join('')||'<tr><td colspan="8">Nuk ka logs.</td></tr>'}</tbody></table></div></div>`}
function renderUsage(){const roleMap={};users.forEach(u=>roleMap[u.role]=(roleMap[u.role]||0)+1);const revenue=reservations.reduce((s,r)=>s+Number(r.cmimi||0),0);adminContent.innerHTML=`<div class="eren-panel"><h3>Raporte mbi përdorimin e platformës</h3><div class="row g-3"><div class="col-md-3"><div class="stat-card"><span>Client</span><b>${roleMap.Client||0}</b></div></div><div class="col-md-3"><div class="stat-card"><span>B2B</span><b>${roleMap.B2B||0}</b></div></div><div class="col-md-3"><div class="stat-card"><span>Travel Agent</span><b>${roleMap.TravelAgent||0}</b></div></div><div class="col-md-3"><div class="stat-card success"><span>Xhiro totale</span><b>${money(revenue)}</b></div></div></div><hr><p class="text-muted">Rezervime totale: <b>${reservations.length}</b>, reviews totale: <b>${reviews.length}</b>, raportime të hapura: <b>${reports.filter(r=>r.status!=='Closed').length}</b>.</p></div>`}
async function approve(id){await fetch(API+`/users/${id}/approve`,{method:'PATCH'});await showAdminTab('users')}
async function deleteUser(id,name){if(!confirm(`A je i sigurt që do ta fshish userin ${name}? Nëse është Travel Agent, do fshihen edhe paketat dhe rezervimet e agjencisë.`))return;const res=await fetch(API+`/users/${id}`,{method:'DELETE'});const data=await res.json().catch(()=>({}));if(!res.ok){alert(data.message||'Nuk u fshi useri');return;}alert(data.message||'User u fshi');await showAdminTab('users')}
async function deleteAllUsers(){if(!confirm('A je i sigurt që do të fshish të gjithë userat e krijuar? Admini kryesor nuk fshihet.'))return;const res=await fetch(API+'/users/delete-all',{method:'DELETE'});const data=await res.json().catch(()=>({}));alert(data.message||'Userat u fshinë');await showAdminTab('users')}
async function cleanupOrphanAgencyData(){const res=await fetch(API+'/users/cleanup-orphan-agency-data',{method:'DELETE'});const data=await res.json().catch(()=>({}));alert(data.message||'Pastrimi u krye');await showAdminTab('users')}
async function deleteReservation(id){if(!confirm('Ta fshij këtë rezervim?'))return;await fetch(API+`/reservations/${id}`,{method:'DELETE'});await showAdminTab('reservations')}
async function closeReport(id){await fetch(API+`/engagement/reports/${id}/close`,{method:'PATCH'});await showAdminTab('reports')}
loadData().then(renderUsers);
</script></body></html>
