<!DOCTYPE html><html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rezervimet</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar"><div class="container-fluid"><a class="navbar-brand" href="index.html"><img src="images/logo.png" class="brand-logo"></a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="paketatTuristike.html">Paketa turistike</a></li><li class="nav-item"><a class="nav-link active" href="rezervimet.html">Rezervimet</a></li><li class="nav-item d-flex" id="authNav"></li></ul></div></div></nav>
<header class="dashboard-header"><div class="container"><h1>Rezervimet e mia</h1><p class="mb-0">Këtu shfaqen rezervimet që ke bërë nga paketa turistike.</p></div></header><main class="container py-5"><div class="eren-panel"><div class="table-responsive"><table class="table"><thead><tr><th>Paketa</th><th>Agjencia</th><th>Datat</th><th>Persona/Dhoma</th><th>Çmimi</th><th>Statusi</th></tr></thead><tbody id="resBody"></tbody></table></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="scripts/app.js"></script><script>
async function load(){const u=requireLogin(['Client','B2B']); if(!u)return; const rs=await jsonFetch(API+`/reservations?email=${encodeURIComponent(u.email)}`); resBody.innerHTML=rs.map(r=>`<tr><td>${r.paketa}</td><td>${r.agencyName||''}</td><td>${new Date(r.dataNisjes).toLocaleDateString('sq-AL')} - ${new Date(r.dataKthimit).toLocaleDateString('sq-AL')}</td><td>${r.nrPersonave} persona<br>${r.nrDhomave} dhoma</td><td><b>${money(r.cmimi)}</b></td><td><span class="badge ${r.confirmed?'badge-approved':'badge-pending'}">${r.confirmed?'Aprovuar':'Në pritje'}</span></td></tr>`).join('')||'<tr><td colspan="6">Nuk ke rezervime ende.</td></tr>';}
load();
</script></body></html>
